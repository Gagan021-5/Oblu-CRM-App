{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Oblu HRMS</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'hrms/css/style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:var(--bg);">
  <div class="card shadow-sm" style="width:380px;">
    <div class="card-body p-4">
      <!-- Fix: Replaced basic purple 'HR' text badge with official Oblu panda emblem for clean, professional look -->
      <div class="text-center mb-4">
        <div class="mark mx-auto d-flex align-items-center justify-content-center mb-3" style="width:54px; height:54px; min-width:54px; max-width:54px; background:#0f172a; border-radius:14px; box-shadow:0 4px 14px rgba(15,23,42,0.18); padding:8px; overflow:hidden;">
          <img src="{% static 'hrms/img/oblu-logo-sm.png' %}?v=3"
               onerror="this.onerror=null; this.src='https://oblu-static-media.s3.ap-south-1.amazonaws.com/vector_panda_logo.png';"
               alt="Oblu Logo"
               width="38"
               height="38"
               style="width:38px; height:38px; max-width:38px; max-height:38px; object-fit:contain; display:block;">
        </div>
        <h4 class="mt-2 mb-0 fw-bold">Oblu HRMS</h4>
        <p class="text-muted small mb-0">Sign in to continue</p>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger py-2 small">Invalid username or password.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100 fw-semibold" style="background:var(--accent); color:#0c1524;">Sign in</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </div>
  </div>
</body>
</html>
