name: Django Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ObluMerge/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'ObluMerge/**'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oblu_ci
          POSTGRES_USER: oblu_ci
          POSTGRES_PASSWORD: oblu_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oblu_ci -d oblu_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ObluMerge/requirements.txt

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libxml2-dev libxslt1-dev libpq-dev unixodbc

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ObluMerge/requirements.txt ]; then python -m pip install --retries 20 --resume-retries 20 --timeout 120 --only-binary=scipy,scikit-learn,pydantic-core,pyodbc,python-bidi -r ObluMerge/requirements.txt; fi

      - name: Run Test Cases
        env:
          SECRET_KEY: ci-test-secret-key-oblu
          DEBUG: "False"
          DATABASE_URL: postgres://oblu_ci:oblu_ci_password@127.0.0.1:5432/oblu_ci
          DB_SSL_REQUIRE: "False"
          OBLU_DISABLE_BIOMETRICS: "1"
        run: |
          cd ObluMerge
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.126.98.201
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd /home/ubuntu/Oblu-CRM-App
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing to deploy: tracked files in /home/ubuntu/Oblu-CRM-App have local changes."
              git status --short
              exit 1
            fi
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD

            if ! dpkg-query -W -f='${db:Status-Status}\n' build-essential python3-dev libxml2-dev libxslt1-dev libpq-dev unixodbc 2>/dev/null | sort -u | grep -qx installed; then
              sudo apt-get update
              sudo apt-get install -y build-essential python3-dev libxml2-dev libxslt1-dev libpq-dev unixodbc
            fi

            source ObluMerge/venv/bin/activate
            cd ObluMerge
            python -m pip install --upgrade pip
            python -m pip install --retries 20 --resume-retries 20 --timeout 120 --only-binary=scipy,scikit-learn,pydantic-core,pyodbc,python-bidi -r requirements.txt
            python -m pip check
            python manage.py check --database default
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
            sudo systemctl is-active --quiet gunicorn
            curl --fail --silent --show-error http://127.0.0.1:8000/login/ >/dev/null
