name: Django Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ObluMerge/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ObluMerge/requirements.txt ]; then pip install -r ObluMerge/requirements.txt; fi

      - name: Run Test Cases
        env:
          SECRET_KEY: ci-test-secret-key-oblu
          DEBUG: "True"
          DATABASE_URL: sqlite:///test_db.sqlite3
        run: |
          cd ObluMerge
          python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.126.98.201
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/Oblu-CRM-App
            git pull origin main
            source ObluMerge/venv/bin/activate
            cd ObluMerge
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
