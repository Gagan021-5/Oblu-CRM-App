name: ObluMerge Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "ObluMerge/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ObluMerge/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. CI JOB: Test, Lint, System Checks, and Migration Validation
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Run Django Checks & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oblumerge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./ObluMerge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "ObluMerge/requirements.txt"

      - name: Install system dependencies (for OpenCV & DeepFace)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        env:
          DJANGO_SETTINGS_MODULE: merger.settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/oblumerge_test
        run: |
          python manage.py check

      - name: Verify Migration Files Consistency
        env:
          DJANGO_SETTINGS_MODULE: merger.settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/oblumerge_test
        run: |
          # Ensures no uncommitted schema changes exist
          python manage.py makemigrations --check --dry-run

      - name: Apply Migrations against Clean Postgres
        env:
          DJANGO_SETTINGS_MODULE: merger.settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/oblumerge_test
        run: |
          python manage.py migrate --noinput

      - name: Test Static Files Collection
        env:
          DJANGO_SETTINGS_MODULE: merger.settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "False"
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/oblumerge_test
        run: |
          python manage.py collectstatic --noinput

  # ─────────────────────────────────────────────────────────────
  # 2. CD JOB: Deploy to VPS / Cloud VM over SSH
  # ─────────────────────────────────────────────────────────────
  cd:
    name: Deploy to Cloud VM / VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "==> Navigating to project directory..."
            DEPLOY_PATH="${{ secrets.DEPLOY_DIR || '/var/www/Oblu-CRM-App' }}"
            cd "$DEPLOY_PATH"

            echo "==> Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Entering ObluMerge..."
            cd ObluMerge

            echo "==> Activating virtual environment..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate

            echo "==> Installing requirements..."
            pip install --no-cache-dir -r requirements.txt

            echo "==> Applying migrations..."
            python manage.py migrate --noinput

            echo "==> Collecting static assets..."
            python manage.py collectstatic --noinput

            echo "==> Restarting Application Service..."
            sudo systemctl restart oblumerge.service

            echo "==> Deployment completed successfully!"
